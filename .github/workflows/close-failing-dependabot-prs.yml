name: Close failing Dependabot PRs

on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-failing-dependabot-prs:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close failed Dependabot PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequests = github.event.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.info('No associated pull requests found for this workflow run.');
              return;
            }

            for (const prInfo of pullRequests) {
              const prNumber = prInfo.number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              if (pr.user?.login !== 'dependabot[bot]') {
                core.info(`Skipping PR #${prNumber} because it is not created by Dependabot.`);
                continue;
              }

              if (pr.state === 'closed') {
                core.info(`PR #${prNumber} is already closed.`);
                continue;
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: 'This Dependabot pull request was automatically closed because the PR validation workflow failed. Please update dependencies or retry after fixing the issue.',
              });
            }
